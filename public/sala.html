<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08080a">
  <title>PositivoS+ En Vivo</title>
  <style>
    :root {
      --bg: #08080a;
      --fg: #f4f4f5;
      --muted: #7c7c85;
      --line: rgba(255,255,255,.09);
      --surface: rgba(255,255,255,.035);
      --accent: #34d399;
      --danger: #f87171;
      --r: 14px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 400 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column;
      padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    }

    /* ── Barra superior, casi invisible ── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      max-width: 620px; width: 100%; margin: 0 auto 8px; flex: none;
    }
    .brand { font-size: 13px; letter-spacing: .01em; color: var(--muted); }
    .brand b { color: var(--fg); font-weight: 600; }
    .top-actions { display: flex; align-items: center; gap: 6px; }

    .icon-btn {
      appearance: none; background: none; border: 1px solid transparent; color: var(--muted);
      font: inherit; font-size: 13px; padding: 7px 11px; border-radius: 999px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; transition: color .15s, background .15s;
    }
    .icon-btn:hover { color: var(--fg); background: var(--surface); }
    .icon-btn.on { color: var(--accent); }

    main { flex: 1; display: flex; flex-direction: column; max-width: 620px; width: 100%; margin: 0 auto; min-height: 0; }

    /* ── Antesala ── */
    #lobby { margin: auto 0; display: flex; flex-direction: column; gap: 22px; padding-bottom: 8vh; }
    .title { font-size: 28px; font-weight: 600; letter-spacing: -.02em; margin: 0; }
    .subtitle { color: var(--muted); font-size: 15px; margin: 6px 0 0; }
    .field { display: flex; flex-direction: column; gap: 8px; }
    .field > span { font-size: 12px; color: var(--muted); letter-spacing: .02em; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    input, select {
      width: 100%; background: var(--surface); border: 1px solid var(--line); color: var(--fg);
      border-radius: var(--r); padding: 14px 15px; font: inherit; font-size: 16px;
      outline: none; transition: border-color .15s;
    }
    input:focus, select:focus { border-color: rgba(255,255,255,.25); }
    select { appearance: none; cursor: pointer;
      background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 19px) 50%, calc(100% - 14px) 50%;
      background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
    select option { background: #16161a; color: var(--fg); }
    .primary {
      width: 100%; border: none; border-radius: var(--r); padding: 16px; cursor: pointer;
      background: var(--fg); color: #0a0a0c; font: inherit; font-size: 16px; font-weight: 600;
      transition: opacity .15s, transform .06s;
    }
    .primary:hover { opacity: .88; }
    .primary:active { transform: scale(.99); }
    .primary:disabled { opacity: .35; cursor: not-allowed; }

    /* ── Sala ── */
    #room { display: none; flex: 1; flex-direction: column; min-height: 0; }

    #subs {
      flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column;
      justify-content: flex-end; gap: 18px; padding: 12px 2px 26px;
      -webkit-mask-image: linear-gradient(180deg, transparent, #000 44px);
              mask-image: linear-gradient(180deg, transparent, #000 44px);
    }
    #subs::-webkit-scrollbar { width: 0; }
    .line { animation: rise .28s ease-out; }
    .line .who { display: block; font-size: 11px; letter-spacing: .07em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 5px; }
    .line .text { font-size: 21px; line-height: 1.42; letter-spacing: -.01em; }
    .line.live .text { color: #c9c9d1; }
    .line.old { opacity: .38; }
    @keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

    .empty { color: var(--muted); font-size: 15px; text-align: center; margin: auto 0; }

    /* ── Control de voz ── */
    .console { flex: none; display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 4px; }
    #mic {
      position: relative; width: 78px; height: 78px; border-radius: 50%; cursor: pointer;
      border: 1px solid var(--line); background: var(--surface); color: var(--fg);
      font-size: 27px; display: grid; place-items: center;
      transition: transform .12s, background .2s, border-color .2s;
    }
    #mic:hover { border-color: rgba(255,255,255,.22); }
    #mic:active { transform: scale(.95); }
    #mic:disabled { opacity: .45; cursor: not-allowed; }
    #mic.on { background: var(--danger); border-color: var(--danger); color: #2b0707; }
    #mic.on::after {
      content: ''; position: absolute; inset: -7px; border-radius: 50%;
      border: 1px solid var(--danger); opacity: .45; animation: ring 1.8s ease-out infinite;
    }
    @keyframes ring { 0% { transform: scale(.92); opacity: .5; } 100% { transform: scale(1.16); opacity: 0; } }
    #micLabel { font-size: 13px; color: var(--muted); min-height: 18px; text-align: center; }

    .meter { width: 74px; height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
    .meter > div { height: 100%; width: 0; background: var(--accent); transition: width .07s linear; }

    /* ── Pie de estado ── */
    footer {
      flex: none; display: flex; align-items: center; justify-content: center; gap: 8px;
      max-width: 620px; width: 100%; margin: 14px auto 0; padding-top: 13px;
      border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); text-align: center;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #4a4a52; flex: none; }
    .dot.live { background: var(--accent); }
    .dot.wait { background: #d4a017; }
    .dot.err  { background: var(--danger); }
    footer.alert { color: var(--danger); }

    @media (max-width: 480px) {
      .line .text { font-size: 19px; }
      .title { font-size: 24px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand"><b>PositivoS+</b> En Vivo</div>
    <div class="top-actions">
      <button class="icon-btn" id="echoBtn" data-i18n-title="room.headphonesHelp" hidden>🔈</button>
      <button class="icon-btn" id="langBtn">🌐 <span id="langCode">ES</span></button>
      <button class="icon-btn" id="leaveBtn" data-i18n="room.leave" hidden></button>
    </div>
  </header>

  <main>
    <section id="lobby">
      <div>
        <h1 class="title">PositivoS+ En Vivo</h1>
        <p class="subtitle" data-i18n="app.tagline"></p>
      </div>

      <label class="field">
        <span data-i18n="lobby.name"></span>
        <input id="name" type="text" data-i18n-ph="lobby.namePh" maxlength="40" autocomplete="name">
      </label>

      <div class="pair">
        <label class="field">
          <span data-i18n="lobby.speak"></span>
          <select id="speakLang"></select>
        </label>
        <label class="field">
          <span data-i18n="lobby.listen"></span>
          <select id="listenLang"></select>
        </label>
      </div>

      <button class="primary" id="enterBtn" data-i18n="lobby.enter"></button>
    </section>

    <section id="room">
      <div id="subs"></div>
      <div class="console">
        <button id="mic">🎙️</button>
        <div class="meter"><div id="meter"></div></div>
        <div id="micLabel"></div>
      </div>
    </section>
  </main>

  <footer id="statusBar"><span class="dot" id="dot"></span><span id="statusText"></span></footer>

  <script src="/i18n.js"></script>
  <script src="/langs.js"></script>
  <script src="/audio-lib.js"></script>
  <script src="/sala.js"></script>
</body>
</html>
